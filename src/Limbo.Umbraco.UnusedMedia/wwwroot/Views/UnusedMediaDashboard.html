<div class="limbo-unused-media-dashboard" ng-controller="Limbo.Umbraco.UnusedMedia.Dashboard.Controller as vm">

    <div style="margin: 15px 0; display: flex; align-items: center; gap: 10px;">
        <h3 style="margin: 0; flex: 1;" ng-bind="vm.page.title"></h3>
    </div>

    <p ng-bind="vm.page.description"></p>

    <div class="umb-pane">

        <div style="margin-bottom: 15px;">
            <label>
                <localize key="unusedMediaDashboard_scanDate">Latest scan</localize>:
            </label>
            <span ng-bind="vm.scanDate"></span>
        </div>

        <div style="margin-bottom: 15px;">
            <label>
                <localize key="unusedMediaDashboard_mediaCount">Media count</localize>:
            </label>
            <span ng-bind="vm.media.length || 0"></span>
        </div>

        <div style="margin-bottom: 15px;">
            <label>
                <localize key="unusedMediaDashboard_mediaFolder">Media folders scanned</localize>:
            </label>
            <span ng-bind="vm.mediaFolderCount || 0"></span>
        </div>

        <div style="margin: 15px 0; display: flex; align-items: center; gap: 10px;">
            <button type="button" class="btn btn-primary" ng-click="vm.startScan()" ng-disabled="vm.scanning">
                <span ng-if="!vm.scanning">
                    <localize key="unusedMediaDashboard_scanButton">Scan media</localize>
                </span>
                <span ng-if="vm.scanning">
                    <localize key="unusedMediaDashboard_scanButtonScanning">Scanning media...</localize>
                </span>
            </button>
            <button type="button" class="btn btn-default" ng-click="vm.clearScan()" ng-disabled="vm.scanning">
                <localize key="unusedMediaDashboard_clearScan">Clear scan</localize>
            </button>
        </div>

        <hr ng-if="vm.showProgress" />

        <div ng-if="vm.showProgress" style="margin-top: 20px;">
            <h3>
                <localize key="unusedMediaDashboard_progress">Progress</localize>
            </h3>

            <div class="progress">
                <div class="bar" ng-style="{width: vm.progressPercentage + '%'}">{{vm.progressPercentage}}%</div>
            </div>

            <p>
                <strong>
                    <localize key="unusedMediaDashboard_processed">Processed</localize>:
                </strong>
                {{vm.currentStatus.progress}} / {{vm.currentStatus.total}}
            </p>
        </div>

        <hr />

        <h3>
            <localize key="unusedMediaDashboard_title">Unused media</localize>
        </h3>
        <table class="table" ng-if="vm.media.length > 0">
            <thead>
                <tr>
                    <th>
                        <localize key="unusedMediaDashboard_name">Name</localize>
                    </th>
                    <th>
                        <localize key="unusedMediaDashboard_lastEdited">Last updated</localize>
                    </th>
                    <th>
                        <localize key="unusedMediaDashboard_createdBy">Created by</localize>
                    </th>
                    <th>
                        <localize key="unusedMediaDashboard_changedBy">Changed by</localize>
                    </th>
                    <th>
                        <localize key="unusedMediaDashboard_totalBytes">Size</localize>
                    </th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="item in vm.media track by item.id">
                    <td>
                        <a ng-href="/umbraco/#/media/media/edit/{{item.id}}" target="_blank" ng-bind="item.name"></a>
                    </td>
                    <td ng-bind="item.updateDateFormatted"></td>
                    <td ng-bind="item.creatorName || '-'"></td>
                    <td ng-bind="item.writerName || '-'"></td>
                    <td ng-bind="item.totalBytesFormatted"></td>
                    <td>
                        <button type="button" class="btn btn-small btn-danger" ng-click="vm.openDeleteOverlay(item)">
                            <localize key="unusedMediaDashboard_delete">Delete</localize>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
        <div ng-if="vm.media.length === 0">
            <p>
                <localize key="unusedMediaDashboard_noMediaFound">No unused media found.</localize>
            </p>
        </div>

    </div>



</div>
